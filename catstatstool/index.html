<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to Catstats</title>
    <script>
        const status_wait = "Waiting for JSON File"
        const status_success = "Ready"
        let packet_page = ""
        
        function submit_file()
        {
            let fileInput = document.getElementById("json_input") 
            if (fileInput.files.length > 0)
            {
                console.log("working")
                let file = fileInput.files[0];
                let reader = new FileReader();
                reader.onload = (ev) => 
                {
                    let obj = JSON.parse(ev.target.result);
                    if(!obj)
                    {
                        alert("Error parsing JSON.");
                        return;
                    }
                    let tu_arr = obj["tossups"]
                    let bonus_arr = obj["bonuses"]
                    packet_page = ""
                    if(tu_arr[0]["category"])
                    {
                        for(let i = 0; i < bonus_arr.length;i++)
                        {
                            let t_cat = tu_arr[i]["category"]
                            let t_subcat = tu_arr[i]["category"]+" - "+tu_arr[i]["subcategory"]
                            let t_ans = tu_arr[i]["answer_sanitized"]
                            let b_cat = bonus_arr[i]["category"]
                            let b_subcat = bonus_arr[i]["category"]+" - "+bonus_arr[i]["subcategory"]
                            let b_ans = bonus_arr[i]["answers_sanitized"][0]+"/"+bonus_arr[i]["answers_sanitized"][1]+"/"+bonus_arr[i]["answers_sanitized"][2]
    
                            packet_page += `${t_ans}\t${t_cat}\t${t_subcat}\t${b_ans}\t${b_cat}\t${b_subcat}\n`
                        }
                    }
                    else
                    {
                        for(let i = 0; i < bonus_arr.length;i++)
                        {
                            let parts = tu_arr[i]["metadata"].split(",")[0].split(" - ")
                            let t_cat = parts[0]
                            let t_subcat = parts[0]
                            if(parts.length > 1) t_subcat = parts[1]
                            let t_ans = tu_arr[i]["answer"]

                            let b_parts = bonus_arr[i]["metadata"].split(",")[0].split(" - ")
                            let b_cat = b_parts[0]
                            let b_subcat = b_parts[0]
                            if(parts.length > 1) b_subcat = b_parts[1]
                            let b_ans = bonus_arr[i]["answers"][0] +"/"+bonus_arr[i]["answers"][1]+"/"+bonus_arr[i]["answers"][2]
                            packet_page += `${t_ans}\t${t_cat}\t${t_subcat}\t${b_ans}\t${b_cat}\t${b_subcat}\n`
                        }
                    }
                    alert("Read!")
                };
                reader.readAsText(file)
            }
            else
            {
                alert("File not found.");
            }
        }

        function copy_packet_page()
        {
            navigator.clipboard.writeText(packet_page)
        }
    </script>
</head>
<body>
    <p>Input JSON Here</p>
    <input type="file" id="json_input" name="json_input"/>
    <button onclick="submit_file()">Submit</button>
    <button onclick="copy_packet_page()">Copy PACKET page</button>
</body>
</html>
